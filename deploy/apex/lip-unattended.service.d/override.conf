# Added by command-box install 20261001T133650Z: use the project venv (system python lacks deps).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
# This drop-in REPLACES the base unit's ExecStart (the empty ExecStart= clears
# it), so the base unit's `env LIP_FORCE_PAPER=1 LIP_PAPER=true` prefix must be
# repeated here: env(1) runs after systemd's environment, so the EnvironmentFile
# (/etc/lip-maker/lip-maker.env) cannot override it.
ExecStart=
ExecStart=/usr/bin/env LIP_FORCE_PAPER=1 LIP_PAPER=true /opt/lip-maker/.venv/bin/python -m mm.unattended --run --heartbeat /var/lib/lip-maker/heartbeat --cancel-log /var/lib/lip-maker/startup-cancel --status-port 8765 --log-file /var/lib/lip-maker/lip.log --summary /var/lib/lip-maker/daily-summary
Environment=LIP_PAPER=true
Environment=LIP_FORCE_PAPER=1
