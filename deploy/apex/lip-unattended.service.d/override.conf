# Added by command-box install 20261001T133650Z: use the project venv (system python lacks deps).
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=5

[Service]
ExecStart=
ExecStart=/opt/lip-maker/.venv/bin/python -m mm.unattended --run --heartbeat /var/lib/lip-maker/heartbeat --cancel-log /var/lib/lip-maker/startup-cancel --status-port 8765 --log-file /var/lib/lip-maker/lip.log --summary /var/lib/lip-maker/daily-summary
Environment=LIP_PAPER=true
