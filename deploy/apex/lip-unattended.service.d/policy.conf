# COMMAND decisions 2026-10-01 (Derek delegated). Paper only.
[Service]
# Review fixes: paper is enforced in code (resolve_mode refuses anything else
# while LIP_FORCE_PAPER is set). Capital pinned to the watchdog's documented
# default so the engine budget (Kalshi 0.95 x min(venue 30%, gross 40%) = $427.50,
# PM US min(300, 0.95 x gross - Kalshi) = $142.50; $570 total) stays well under
# LIP_WD_MAX_CAPITAL_USD=1600. NOTE: /etc/lip-maker/lip-maker.env
# (EnvironmentFile) overrides these Environment= lines; remove LIP_BANKROLL
# from that file or set it there. The engine warns loudly and clamps its
# allocation to LIP_WD_MAX_CAPITAL_USD when its budget would exceed it.
Environment=LIP_FORCE_PAPER=1
Environment=LIP_BANKROLL=1500
Environment=LIP_LONG_DATED_EVENT_DAYS=95
Environment=LIP_MIN_HOURS_TO_CLOSE=48
Environment=LIP_CANDIDATE_TOP=1000
Environment=LIP_HOLDING_MODEL=carry
Environment=LIP_CARRY_APR=0.10
Environment=LIP_DURABLE_RESERVE=0.5
Environment=LIP_DURABLE_MIN_DAYS=14
# Patch 15 (2026-10-01 audit, paper only): size ladder, event cap, event window, fill/inventory guards, re-peg, pulls.
Environment=LIP_SIZE_LADDER=100,200,300,500,750,1000
Environment=LIP_EVENT_CAP_FRAC=0.15
Environment=LIP_EVENT_WINDOW_HOURS=6
Environment=LIP_FILL_COOLDOWN_S=1800
Environment=LIP_MARKET_INV_CAP_USD=25
Environment=LIP_EVENT_INV_CAP_USD=75
Environment=LIP_REPEG_MIN_S=5
Environment=LIP_PULL_MOVE_CENTS=5
Environment=LIP_MOVE_COOLDOWN_S=600
Environment=LIP_CROSS_GUARD=1
Environment=LIP_FAST_ALLOCATE=1
# Patch 16 (2026-10-01, paper only): external fair value guard (Polymarket Gamma + Open-Meteo ensemble rain). Defensive only.
Environment=LIP_FV_ENABLE=1
Environment=LIP_FV_DISAGREE_CENTS=8
Environment=LIP_FV_WEATHER_DISAGREE_CENTS=20
Environment=LIP_FV_MIN_CONF=0.6
Environment=LIP_FV_REFRESH_S=300
# Weather fair value (2026-10-01, PAPER ONLY; FV quoting is refused outside paper mode in code):
# model fair value (Open-Meteo ensemble + NWS observations, mm/unattended/fv_weather.py) drives
# quotes for verified KXHIGH daily-high stations; every other family keeps the Patch 16 guard.
# Paper data collection with the UNFITTED conservative defaults (inflation 1.4, kernel sd 1.75 F,
# bias 0: fit with tools/fit_fv_weather.py once 30+ city-days per station have settled). No
# selection credit for the model until /status fv_calibration.verdict is model_better_than_book
# (200 paired markets AND 40 paired events). Open-Meteo free tier is non-commercial: review its
# terms before any live use. See deploy/apex/README.md "Weather fair value (paper)".
Environment=LIP_FV_CALIB_ENABLE=1
Environment=LIP_FV_QUOTE_ENABLE=1
Environment=LIP_FV_QUOTE_FAMILIES=KXHIGH
Environment=LIP_FV_MIN_HOURS_TO_CLOSE=24
Environment=LIP_FV_MAX_GIVEUP_CENTS=0
Environment=LIP_FV_LONGSHOT_TILT=0
# Patch 18 (2026-10-01, paper only): inventory skew replaces the 30-min fill cooldown (LIP_FILL_COOLDOWN_S ignored while enabled).
Environment=LIP_SKEW_ENABLE=1
Environment=LIP_SKEW_MAX_TICKS=2
Environment=LIP_SKEW_MAX_BACKOFF=1
Environment=LIP_SKEW_MAX_REWARD_LOSS=0.5
# Patch 19: bounded compressed frame recorder (replay with: python -m mm.replay bench).
Environment=LIP_RECORD_ENABLE=1
Environment=LIP_RECORD_DIR=/var/lib/lip-maker/recordings
# Derek 2026-10-01: 12 GB keeps ~14 days at the measured ~31 MB/h (5 GB held ~6-7 days).
Environment=LIP_RECORD_MAX_GB=12
Environment=LIP_RECORD_RETENTION_DAYS=14
Environment=LIP_RECORD_MIN_FREE_GB=10
# Patch 20: Polymarket US PAPER maker venue (public read-only gateway data; order endpoints hard-disabled).
Environment=LIP_PMUS_PAPER_ENABLE=1
Environment=LIP_PMUS_BUDGET_USD=300
Environment=LIP_PMUS_MARKET_CAP_USD=100
Environment=LIP_PMUS_PERIODS=daily_event,early,pre_day
# Patch 21 (live since 2026-10-01 16:27 PT; never copied into this file until 2026-10-02):
# metadata backlog cap per refresh (300 took ~9.5 h to clear the backlog).
Environment=LIP_PMUS_META_MAX=3000
# Derek 2026-10-01: shared-pool reading (rewardPool / members of programId+period).
# Also the code default since 95854f5; pinned so a default change cannot flip it.
Environment=LIP_PMUS_POOL_SPLIT=members
# 2026-10-02 verified: polymarket.us/rewards says the reward pool is "shared across the
# program's markets - never summed per market" and lists each program's market count
# (= members). Keep members. See /workspace/arb/do/PMUS_ZERO_2026-10-02.md.
# 2026-10-04 Kalshi paper zero-fill fix (COMMAND approved, paper only). See
# /workspace/arb/do/LIPMAKER_FIX_DEPLOY_2026-10-04.md.
# Websocket: subscribe at most 150 books (resting/held/cooldown markets always,
# 20 most traded, 60 top-ranked, 40 rotating through the other candidates every
# 120 s); LIP_CANDIDATE_TOP stays the rotation pool. The unused ticker channel is off.
Environment=LIP_WS_SUB_MAX=150
Environment=LIP_WS_SUB_CORE=60
Environment=LIP_WS_SUB_ACTIVE=20
Environment=LIP_WS_SUB_ROTATE=40
Environment=LIP_WS_ROTATE_S=120
Environment=LIP_WS_CHANNELS=orderbook_delta,trade
# Clock-skew guard clears only after 15 s of clean frames (was: one clean frame).
Environment=LIP_CLOCK_SKEW_CLEAR_S=15
# Paper fill simulator: book depletion + keep queue on same-price re-quotes.
Environment=LIP_SIM_BOOK_DEPLETION=1
Environment=LIP_SIM_KEEP_QUEUE=1
# Placement: up to 2 ticks above the LIP reference toward the touch (full LIP
# credit, maker only, never crosses/locks).
Environment=LIP_JOIN_TOUCH=1
Environment=LIP_JOIN_MAX_TICKS=2
# Selection: de-weight markets that do not trade (24 h volume; floor 0.3 at 0).
Environment=LIP_ACTIVITY_WEIGHT=1
Environment=LIP_ACTIVITY_FLOOR=0.3
Environment=LIP_ACTIVITY_REF_VOL=200
# Fill-sampling group: 8 Kalshi markets with >= 20 trades/24 h, 10 contracts per
# side at best bid, no rank penalty, $80 reserved out of the Kalshi budget.
Environment=LIP_SAMPLE_ENABLE=1
Environment=LIP_SAMPLE_N=8
Environment=LIP_SAMPLE_MIN_TRADES_DAY=20
Environment=LIP_SAMPLE_SIZE=10
Environment=LIP_SAMPLE_BUDGET_USD=80
Environment=LIP_SAMPLE_PER_EVENT=2
